# FXCM 数据处理系统 Web 界面配置文件
# ===============================================

[界面设置]
# 页面标题
page_title = "FXCM 数据处理系统"

# 页面图标 (emoji)
page_icon = "📈"

# 布局模式 (wide/centered)
layout = "wide"

# 侧边栏默认状态 (expanded/collapsed)
sidebar_state = "expanded"

[默认配置]
# 默认货币对列表
default_instruments = ["EURUSD", "USDCAD", "GBPUSD", "USDCHF", "AUDUSD", "USDJPY"]

# 默认时间范围
default_start_year = 2015
default_end_year = 2025

# 默认转换时间周期
default_conversion_timeframes = ["M5", "M15", "M30", "H1"]

# 默认重试次数
default_max_retries = 5

# 默认跳过已存在文件
default_skip_existing = true

[界面主题]
# 主题颜色 (可选: light, dark)
theme = "light"

# 主要颜色
primary_color = "#FF6B6B"

# 背景颜色
background_color = "#FFFFFF"

# 文本颜色
text_color = "#000000"

[日志设置]
# 最大日志条数
max_log_entries = 1000

# 显示日志条数
display_log_entries = 50

# 自动滚动日志
auto_scroll_logs = true

# 默认日志级别
default_log_level = "ALL"

[性能设置]
# 自动刷新间隔 (秒)
auto_refresh_interval = 2

# 进度更新间隔 (秒)
progress_update_interval = 1

# 最大并发任务数
max_concurrent_tasks = 1

[数据设置]
# 数据目录
data_directory = "fxcm_data"

# 日志目录
log_directory = "logs"

# 支持的时间周期
supported_timeframes = ["M1", "M5", "M15", "M30", "H1", "D1"]

# 原始时间周期 (不可转换)
original_timeframes = ["M1", "D1"]

# 可转换时间周期
convertible_timeframes = ["M5", "M15", "M30", "H1"]